<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - Português (Brasil)</title>
    <meta name="description" content="Open-source Portuguese IPA translator (Português Brasil). Converts Brazilian Portuguese to IPA transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>Tradutor IPA</h1>
        <h2>Português (pt-BR)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            Texto -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">Português (pt) ▾</button>
          </label>
          <textarea id="cWords_tBox" rows="10">Olá a todos! O Alfabeto Fonético Internacional (AFI) é como um código universal para a pronúncia. Esta ferramenta converte instantaneamente seu texto em símbolos fonéticos padrão. Tente digitar algumas frases do dia a dia, como "O tempo está ótimo hoje" ou "Obrigado", ou qualquer palavra que você tenha curiosidade, para ver como elas aparecem no sistema fonético!</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Descrição</h4>
          <p>Este é um projeto de código aberto para traduzir português para IPA.</p>
        </div>

      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
