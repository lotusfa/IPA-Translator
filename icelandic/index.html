<!doctype html>
<html lang="is">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - Íslenska</title>
    <meta name="description" content="Open-source Icelandic IPA translator. Converts Íslenska text to International Phonetic Alphabet transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>IPA Þýðari</h1>
        <h2>Íslenska (is)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            Texti -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">Íslenska (is) ▾</button>
          </label>
          <textarea id="cWords_tBox" rows="10">Velkomin! Alþjóðlega hljóðstafrófið (IPA) er algilt kerfi til að umrita hljóð hvers konar mannamáls. Notaðu þetta tól til að breyta hversdagslegum orðum — eins og „takk" eða „veðrið er gott í dag" — samstundis í nákvæm hljóðtákn. Sláðu inn setningu hér til að byrja!</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Lýsing / Description</h4>
          <p>Þetta er opið verkefni til að þýða íslensku yfir í IPA.</p>
          <p>This is an open-source project to translate Icelandic to IPA.</p>
        </div>

      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
