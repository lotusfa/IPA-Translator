<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - English</title>
    <meta name="description" content="Open-source English to IPA translator. Converts English text to International Phonetic Alphabet with US and UK pronunciation variants." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>IPA Translator</h1>
        <h2>English</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            Text -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">English (en) ▾</button>
            <button id="speak-btn" class="btn-icon" aria-label="Read aloud">
            </button>
          </label>
          <textarea id="cWords_tBox" rows="10" placeholder="Input some English words.">The International Phonetic Alphabet (IPA) is an alphabetic system of phonetic notation based primarily on the Latin alphabet. It was devised by the International Phonetic Association in the late 19th century as a standardized representation of the sounds of spoken language.</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="form-check-inline" style="align-items: baseline; margin-bottom: 5px;">
          <span style="font-weight: 500; margin-right: 5px;">Pronounced:</span>
          <input type="radio" name="inlineRadioOptions" id="IPA_US" checked />
          <label for="IPA_US">US</label>
        </div>
        <div class="form-check-inline">
          <input type="radio" name="inlineRadioOptions" id="IPA_UK" />
          <label for="IPA_UK">UK</label>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Description</h4>
          <p>This is an open-source project to translate English to IPA.</p>
        </div>

        <div class="footer-col">
          <h4>Useful Links</h4>
          <ul>
            <li><a href="https://en.wikipedia.org/wiki/Help:IPA/English">WIKI - IPA/English</a></li>
            <li><a href="https://open-dict-data.github.io/ipa-lookup/en/">English IPA Lookup</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
</body>
</html>
