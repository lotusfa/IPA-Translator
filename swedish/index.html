<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uttalsskrift / IPA-transkription - Swedish IPA Translator</title>
    <meta name="description" content="Open-source Swedish IPA translator (IPA-transkription). Converts Svenska text to International Phonetic Alphabet." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>IPA-transkription</h1>
        <h2>Swedish</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            Text -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">Svenska (sv) ▾</button>
            <button id="speak-btn" class="btn-icon" aria-label="Read aloud">
            </button>
          </label>
          <textarea id="cWords_tBox" rows="10">Välkommen! Det internationella fonetiska alfabetet (IPA) är ett universellt system för att transkribera ljuden i alla mänskliga språk. Använd det här verktyget för att omedelbart konvertera vardagliga ord — som "tack" eller "vädret är fint idag" — till exakta fonetiska symboler. Skriv in en mening här för att komma igång!</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA-tecken / IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Beskrivning / Description</h4>
          <p>Detta är ett öppen källkodsprojekt för att översätta svenska till IPA.</p>
          <p>This is an open-source project to translate Swedish to IPA.</p>
        </div>

        <div class="footer-col">
          <h4>Användbara länkar / Useful Links</h4>
          <ul>
            <li><a href="https://en.wikipedia.org/wiki/Help:IPA_for_Swedish">WIKI - IPA for Swedish</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
