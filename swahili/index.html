<!doctype html>
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tafsiri IPA - Swahili IPA Translator</title>
    <meta name="description" content="Open-source Swahili IPA translator (Kiswahili). Converts Swahili text to International Phonetic Alphabet transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>Tafsiri ya IPA</h1>
        <h2>Swahili IPA Translator</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            Neno -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">Kiswahili (sw) ▾</button>
            <button id="speak-btn" class="btn-icon" aria-label="Read aloud">
            </button>
          </label>
          <textarea id="cWords_tBox" rows="10">Karibu! Alfabeti ya Kifonetiki ya Kimataifa (IPA) ni mfumo wa kimataifa wa kuandika sauti za lugha yoyote ya binadamu. Tumia zana hii kubadilisha maneno ya kila siku — kama 'asante' au 'hali ya hewa ni nzuri leo' — kuwa alama sahihi za kifonetiki mara moja. Andika sentensi hapa ili uanze!</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA / Kiswahili</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Maelezo / Description</h4>
          <p>Hii ni mradi wa wazi wa tafsiri ya Kiswahili kwenda IPA.</p>
          <p>This is an open-source project to translate Swahili to IPA.</p>
        </div>

        <div class="footer-col">
          <h4>Vyanzo Muhimu / Useful Links</h4>
          <ul>
            <li><a href="https://sw.wikipedia.org/wiki/Kiswahili">WIKI - Kiswahili</a></li>
            <li><a href="https://en.wikipedia.org/wiki/Help:IPA_for_English">WIKI - IPA</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
