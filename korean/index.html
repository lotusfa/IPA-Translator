<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - 한국어</title>
    <meta name="description" content="Open-source Korean IPA translator (한국어). Converts Korean text to International Phonetic Alphabet transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>한국어 국제 음성 기호 번역기</h1>
        <h2>Korean IPA Translator</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            텍스트 -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">한국어 (ko) ▾</button>
            <button id="speak-btn" class="btn-icon" aria-label="Read aloud"></button>
          </label>
          <textarea id="cWords_tBox" rows="10">안녕하세요 여러분! 국제 음성 기호 (IPA)는 발음을 위한 공용 암호와 같습니다. 이 도구는 입력한 글자를 즉시 표준 음성 기호로 변환해 줍니다. "오늘 날씨가 정말 좋네요"나 "감사합니다"와 같은 일상적인 대화, 또는 궁금한 단어를 입력해서 음성 기호 시스템에서 어떻게 나타나는지 확인해 보세요!</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6"></div>
      <div class="col-md-6">
        <div class="form-check-inline">
          <input type="checkbox" id="allow_words_search" checked />
          <label for="allow_words_search">Allow Words Search</label>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>설명 / Description</h4>
          <p>이는 한국어를 IPA로 번역하는 오픈소스 프로젝트입니다.</p>
          <p>This is an open-source project that translates Korean into IPA.</p>
        </div>

      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
