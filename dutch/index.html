<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - Nederlands</title>
    <meta name="description" content="Open-source Dutch to IPA translator. Converts Nederlands text to International Phonetic Alphabet pronunciation." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>IPA-vertaler</h1>
        <h2>Nederlands (nl)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            Tekst -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">Nederlands (nl) ▾</button>
          </label>
          <textarea id="cWords_tBox" rows="10">Hallo allemaal! Het Internationaal Fonetisch Alfabet (IPA) is als een universele code voor uitspraak. Deze tool zet je tekst direct om in standaard fonetische symbolen. Probeer eens wat dagelijkse zinnen in te voeren, zoals "Het weer is mooi vandaag" of "Dank je wel", of woorden waar je nieuwsgierig naar bent, om te zien hoe ze eruitzien in het fonetische systeem!</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Beschrijving / Description</h4>
          <p>Dit is een open-source project om Nederlands naar IPA te vertalen.</p>
        </div>

      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
