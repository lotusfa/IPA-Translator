<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - Nederlands</title>
    <meta name="description" content="Open-source Dutch to IPA translator. Converts Nederlands text to International Phonetic Alphabet pronunciation." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>IPA-vertaler</h1>
        <h2>Nederlands (nl)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>Nederlandse tekst</label>
          <textarea id="cWords_tBox" rows="10" placeholder="Voer Nederlandse tekst in.">Het Internationaal Fonetisch Alfabet (IPA) is een systeem van fonetische notatie dat door taalkundigen wereldwijd wordt gebruikt om de klanken van gesproken taal weer te geven.</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <label>IPA</label>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="form-check-inline">
          <input type="checkbox" id="wf_c_words" checked />
          <label for="wf_c_words">Met Nederlandse woorden / With Dutch Words</label>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Beschrijving / Description</h4>
          <p>Dit is een open-source project om Nederlands naar IPA te vertalen.</p>
        </div>

        <div class="footer-col">
          <h4>Nuttige links / Useful Links</h4>
          <ul>
            <li><a href="./ipa_list.html">IPA-database (Nederlands)</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
