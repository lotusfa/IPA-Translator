<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Listă de cuvinte în română cu pronunție (Romanian IPA word list.)" />
    <title>Română - IPA List</title>
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <div class="header">
      <div class="titles">
        <h1>Listă de cuvinte / Romanian IPA List</h1>
        <h2>Română (ro)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="container">
      <div class="row" style="margin-bottom: 15px;">
        <div class="col" style="flex: 0 0 auto;">
          <h5 style="margin: 0;"><a href="./index.html">← Înapoi / Back to Translator</a></h5>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <div class="table-responsive">
          <table class="table table-striped display" id="DataTable">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Cuvânt în română / Romanian Word</th>
                <th scope="col">IPA 音標 / IPA</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Descriere</h4>
          <p>Acest proiect open-source convertește româna în IPA.</p>
        </div>

        <div class="footer-col">
          <h4>Alte limbi / Other Languages</h4>
          <ul class="lang-list" id="lang-buttons-container">

</ul>
        </div>

        <div class="footer-col">
          <h4>Link-uri</h4>
          <ul>
            <li><a href="./ipa_list.html">Bază de date IPA</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script src="../lib/jquery/jquery.min.js"></script>
    <script src="../lib/datatables/datatables.min.js"></script>
    <link rel="stylesheet" type="text/css" href="../lib/datatables/datatables.min.css"/>

    <script type="module">
      import { initIPAListPage } from '../js/ui.js';

      await initIPAListPage({
        language: 'ro-RO',
        tableJsonPath: '../json/ro.json',
        tableId: 'DataTable',
        enableTTS: true
      });
    </script>
  </body>
</html>
