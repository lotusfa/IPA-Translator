<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - Română</title>
    <meta name="description" content="Open-source Romanian IPA translator. Converts Română text to International Phonetic Alphabet transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>Traducător IPA</h1>
        <h2>Română (ro)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>Text în limba română</label>
          <textarea id="cWords_tBox" rows="10" placeholder="Introduceți text în limba română.">Alfabetul Fonetic Internațional (AFI) este un sistem de notație fonetică bazat în principal pe alfabetul latin. A fost conceput de Asociația Fonetică Internațională la sfârșitul secolului al XIX-lea ca o reprezentare standardizată a sunetelor limbajului vorbit.</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <label>IPA</label>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="form-check-inline">
          <input type="checkbox" id="wf_c_words" checked />
          <label for="wf_c_words">Cu cuvinte românești / With Romanian Words</label>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Descriere</h4>
          <p>Acesta este un proiect open-source pentru traducerea românei în IPA.</p>

          <h4 style="margin-top:20px">Link-uri utile</h4>
          <ul>
            <li><a href="./ipa_list.html">Bază de date IPA (Română)</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4>Alte limbi / Other Languages</h4>
          <ul class="lang-list" id="lang-buttons-container">
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
