<!doctype html>
<html lang="eo">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esperanto Vortaro IPA - Esperanto IPA List</title>
    <meta name="description" content="Esperanto IPA word list. Browse and search Esperanto words with their International Phonetic Alphabet transcriptions." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>Esperanto Vortaro IPA</h1>
        <h2>Esperanto IPA List</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

      <div class="row" style="margin-bottom: 15px;">
        <div class="col" style="flex: 0 0 auto;">
          <h5 style="margin: 0;"><a href="./index.html">← Back to Translator</a></h5>
        </div>
      </div>

    <div class="container">
      <div class="table-responsive">
      <table id="DataTable" class="table table-striped display">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Esperanto Word</th>
            <th scope="col">IPA</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
</div>
    </div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>Description</h4>
          <p>Esperanto IPA word list.</p>

          <h4 style="margin-top:20px">Useful Links</h4>
          <ul>
            <li><a href="./ipa_list.html">IPA Database</a></li>
            <li><a href="https://en.wikipedia.org/wiki/Help:IPA/Esperanto">WIKI - IPA/Esperanto</a></li>
            <li><a href="https://open-dict-data.github.io/ipa-lookup/eo/">Esperanto IPA Lookup</a></li>
          </ul>
        </div>

        <div class="footer-col">
          <h4>Other Languages</h4>
          <ul class="lang-list" id="lang-buttons-container">
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script src="../lib/jquery/jquery.min.js"></script>
    <script src="../lib/datatables/datatables.min.js"></script>
    <link rel="stylesheet" type="text/css" href="../lib/datatables/datatables.min.css"/>

    <script type="module">
      import { initIPAListPage } from '../js/page/ipa-list-page.js';

      await initIPAListPage({
        language: 'eo',
        tableJsonPath: '../json/eo.json',
        tableId: 'DataTable',
        enableTTS: false
      });
    </script>
  </body>
</html>
