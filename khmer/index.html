<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - ភាសាខ្មែរ</title>
    <meta name="description" content="Open-source Khmer IPA translator (ភាសាខ្មែរ). Converts Khmer text to International Phonetic Alphabet transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>អក្សរ IPA</h1>
        <h2>ភាសាខ្មែរ (km)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            អត្ថបទ -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">ខ្មែរ (km) ▾</button>
          </label>
          <textarea id="cWords_tBox" rows="10">សួស្តីអ្នកទាំងអស់គ្នា! អក្ខរក្រមសូរសព្ទអន្តរជាតិ (IPA) គឺប្រៀបដូចជាកូដសកលសម្រាប់បញ្ចេញសំឡេង។ ឧបករណ៍នេះនឹងបំប្លែងអត្ថបទដែលអ្នកបញ្ចូលទៅជាសញ្ញាសូរសព្ទស្តង់ដារភ្លាមៗ។ សាកល្បងបញ្ចូលឃ្លាប្រចាំថ្ងៃមួយចំនួន ដូចជា "ថ្ងៃនេះមេឃស្រឡះល្អណាស់" ឬ "អរគុណ" ឬពាក្យផ្សេងៗដែលអ្នកចង់ដឹង ដើម្បីមើលថាតើពួកវាបង្ហាញយ៉ាងដូចម្តេចក្នុងប្រព័ន្ធសូរសព្ទ!</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>ការពិពណ៌នា / Description</h4>
          <p>នេះគឺជាគម្រោង open-source សម្រាប់បកប្រែភាសាខ្មែរទៅជា IPA។</p>
          <p>This is an open-source project to translate Khmer to IPA.</p>
        </div>

      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
