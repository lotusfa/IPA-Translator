<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日本語音標変換 / Japanese IPA Translator - Japanese IPA Translator</title>
    <meta name="description" content="Open-source Japanese IPA translator (日本語音標変換). Converts Japanese text to International Phonetic Alphabet transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>日本語音標変換</h1>
        <h2>Japanese Phonetic Converter</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            テキスト -
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">日本語 (ja) ▾</button>
            <button id="speak-btn" class="btn-icon" aria-label="Read aloud">
            </button>
          </label>
          <textarea id="cWords_tBox" rows="10">こんにちは、皆さん！国際音声記号 (IPA) は、発音のための共通パスワードのようなものです。このツールは、入力した文字を瞬時に標準的な音声記号に変換します。「今日はいい天気ですね」や「ありがとう」といった日常会話や、気になる単語を入力して、音声記号システムでどのように表示されるか試してみてください！</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6"></div>
      <div class="col-md-6">
        <div class="form-check-inline">
          <input type="checkbox" id="allow_words_search" checked />
          <label for="allow_words_search">Allow Words Search</label>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>説明 (Description)</h4>
          <p>これは日本語を国際音声記号に変換するオープンソースプロジェクトです。</p>
          <p>This is an open-source project to translate Japanese to IPA.</p>
        </div>

        <div class="footer-col">
          <h4>便利なリンク / Useful Links</h4>
          <ul>
            <li><a href="https://en.wikipedia.org/wiki/Help:IPA/Japanese">WIKI - IPA/Japanese</a></li>
            <li><a href="https://open-dict-data.github.io/ipa-lookup/ja/">Japanese IPA Lookup</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
