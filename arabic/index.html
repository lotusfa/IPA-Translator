<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPA Translator - Arabic (العربية)</title>
    <meta name="description" content="Open-source Arabic to IPA translator. Translates Arabic text to International Phonetic Alphabet transcription." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>مترجم IPA</h1>
        <h2>Arabic (العربية)</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label>
            النص العربي / Arabic paragraph
            <button id="lang-selector-btn" class="btn-icon" aria-label="Select language">العربية (ar) ▾</button>
            <button id="speak-btn" class="btn-icon" aria-label="Read aloud">
            </button>
          </label>
          <textarea id="cWords_tBox" rows="10" placeholder="Input some Arabic words.">اللغة العربية لغة جميلة وغنية بالأدب والشعر.</textarea>
        </div>
      </div>

      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label>IPA</label>
            <div class="output-controls" id="output-controls">
            <button id="copy-output-btn" class="btn-icon" aria-label="Copy">📋</button>
            <span class="output-sep">•</span>
            <button id="display-format-btn" class="btn-icon format-toggle-btn">(文字 /ipa/) ▾</button>
          </div>
          </div>
          <textarea id="IPA_tBox" rows="10" disabled></textarea>
        </div>
      </div>
    </div>

    <div class="tools-row" id="footer-tools"></div>

    <footer class="footer">
      <div class="footer-grid">
        <div class="footer-col">
          <h4>الوصف / Description</h4>
          <p>هذا مشروع مفتوح المصدر لترجمة العربية إلى IPA.</p>
          <p>This is an open-source project to translate Arabic to IPA.</p>
        </div>

        <div class="footer-col">
          <h4>الروابط المفيدة / Useful Links</h4>
          <ul>
            <li><a href="./ipa_list.html">قاعدة بيانات IPA / IPA Database (Arabic)</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>
          <a href="https://github.com/lotusfa/IPA-Translator">GitHub</a>
          &nbsp;|&nbsp;
          Copyright © <a href="https://lotusfa.com/">LotusFa</a>
        </p>
      </div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
